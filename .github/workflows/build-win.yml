name: Build & Verify Windows Setup

# 触发方式（任选其一都会跑这套打包+验证）：
#   - 推 v* 标签（正式发版，并自动创建 GitHub Release）
#   - 手动触发（workflow_dispatch，可传版本号；只上传 artifact，不发 Release）
#   - 推 master/main（可选，防回归）
#
# 版本号解析优先级：v* 标签名（去掉前导 v）> 手动输入 > 源码 DAEMON_VERSION。
# 打标签发版必须用标签名作为构建版本：产物名是 WorkDaddy[-AI]-Setup-<ver>.exe，
# 更新器要求资产名严格等于 WorkDaddy-Setup-<release tag>.exe，且包内 daemon/app 版本
# 必须等于该版本，否则会以「安装包名称与目标 profile 或版本不一致」或
# 「安装包内部 daemon 版本 X 与目标版本 Y 不一致」拒绝安装。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.4），留空则从代码读取'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Setup.exe + verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装固定 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: 校验 CRLF（cmd 必须 CRLF，否则 cmd.exe 解析括号块会失败）
        shell: bash
        run: |
          for f in scripts/*.cmd; do
            # 不要用 grep 去匹配 CR 字节：Windows 上的 GNU grep 会把它判定为
            # 文本的文件的 CR 剥掉再匹配，那种写法在 windows-latest 上永远返回
            # 非 0，循环会固定死在 glob 排序的第一个文件上误报（实测两次 CI 都报
            # Install-WorkDaddy.cmd，而该文件在 git blob 与检出结果里都含 47 个
            # CRLF）。这里直接看字节，不依赖 grep 的换行处理。
            HEX="$(od -An -tx1 "$f" | tr -d ' \n')"
            case "$HEX" in
              *0d0a*) ;;
              *)
                echo "::error::$f 不是 CRLF，无法在 Windows 使用，请转换"
                exit 1
                ;;
            esac
          done
          echo "所有 .cmd 均为 CRLF ✓"

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VER=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VER" ]; then
            VER=$(grep -o "const DAEMON_VERSION = '[^']*'" scripts/daemon.js | head -1 | cut -d"'" -f2)
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 x.y.z（当前解析为 '$VER'）"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "检测到版本: $VER"

      - name: 校验内置资产 builtin（Windows 安装包必须包含）
        shell: bash
        run: |
          SRC="scripts/builtin"
          if [ ! -f "$SRC/nebula/theme.json" ] || [ ! -d "$SRC/wallpapers" ]; then
            echo "::error::缺少内置资产 $SRC（需要 nebula/theme.json 和 wallpapers/）"
            exit 1
          fi
          COUNT=$(find "$SRC/wallpapers" -maxdepth 1 -type f -iname '*.webp' | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::内置资产没有任何官方壁纸"
            exit 1
          fi
          echo "已校验 builtin 资产：$COUNT 张壁纸"

      - name: 生成 Windows 安装暂存包（仅供 Inno Setup 使用）
        shell: bash
        env:
          WORKDADDY_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-win-zip.sh

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE" }

      - name: 生成 Setup.exe（用户态 Inno Setup 安装包）
        shell: pwsh
        run: |
          $version = (Select-String -Path scripts\daemon.js -Pattern "const DAEMON_VERSION = '([^']+)'" ).Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
            -File .\scripts\build-win-installer.ps1 -IsccPath $iscc -Profile workbuddy-cn -Version ${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "WorkDaddy Setup build failed with exit code $LASTEXITCODE" }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
            -File .\scripts\build-win-installer.ps1 -IsccPath $iscc -Profile workbuddy-ai -Version ${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "WorkDaddy AI Setup build failed with exit code $LASTEXITCODE" }

      - name: 确认仅保留 Setup.exe 发行产物
        shell: pwsh
        run: |
          $legacyZip = Get-ChildItem -LiteralPath release\windows -Filter '*-win64.zip' -File -ErrorAction SilentlyContinue
          if ($legacyZip) {
            $legacyZip | Remove-Item -Force
          }
          if (Get-ChildItem -LiteralPath release\windows -Filter '*-win64.zip' -File -ErrorAction SilentlyContinue) {
            throw 'Windows 发布目录仍包含旧 ZIP 产物。'
          }

      - name: 校验产物名与发版版本一致
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          for f in "release/windows/WorkDaddy-Setup-$V.exe" "release/windows/WorkDaddy-AI-Setup-$V.exe"; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少 $f（产物名必须等于 WorkDaddy[-AI]-Setup-<version>.exe，否则更新器会拒绝安装）"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: 列出产物
        shell: bash
        run: ls -lh release/windows/

      - name: 产物完整性自检（verify-win.cmd，纯只读）
        shell: cmd
        run: |
          call scripts\verify-win.cmd

      - name: 上传产物（仅 Setup.exe）
        uses: actions/upload-artifact@v4
        with:
          name: workdaddy-win64
          path: |
            release/windows/WorkDaddy-Setup-*.exe
            release/windows/WorkDaddy-AI-Setup-*.exe

      # ---- 只有打 tag 时才顺手挂到 GitHub Release ----
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/WorkDaddy-Setup-*.exe
            release/windows/WorkDaddy-AI-Setup-*.exe
          generate_release_notes: true
